query GetProducts(
  $limit: Int!
  $where: ProductFilter
  $order: [ProductOrder]
) {
  productCollection(limit: $limit, where: $where, order: $order) {
    total
    items {
      sys {
        id
      }
      name
      description {
        json
      }
      slug
      price
      category
      tags
      featured
      imagesCollection(limit: 1) {
        items {
          url
          title
        }
      }
    }
  }
}
